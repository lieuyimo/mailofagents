name: ci

# Tests on every push to main and every pull request. Release artifacts stay
# tag-only in release.yml; this workflow never publishes anything.
#
# Like release.yml, we use the runner-preinstalled Go instead of
# actions/setup-go: its codeload tarball download was persistently
# 429-rate-limited in this repo (release.yml §"Go toolchain"). `go version`
# keeps the toolchain actually used visible in the log.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + vet + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Go toolchain (runner-preinstalled)
        run: go version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Frontend structure gates
        run: |
          bash scripts/audit_frontend_imports.sh
          python3 scripts/audit_free_identifiers.py

      - name: Backend structure gate
        run: go run ./cmd/audit-structure

      - name: Verify race shards cover every server test
        run: bash scripts/ci_race_shard.sh check

  race:
    name: race (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # One combined job spent ~9 min, almost all in server's real-time waits
    # under -race. Split by feature (scripts/ci_race_shard.sh) so the shards
    # run in parallel; the slowest shard is the critical path.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [store, auth, mail, org, ops]
    steps:
      - uses: actions/checkout@v4

      - name: Go toolchain (runner-preinstalled)
        run: go version

      - name: Race detector
        run: |
          if [ "${{ matrix.shard }}" = "store" ]; then
            go test -race ./internal/store
          else
            pattern=$(bash scripts/ci_race_shard.sh "${{ matrix.shard }}")
            go test -race ./internal/server -run "$pattern"
          fi
