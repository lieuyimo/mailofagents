name: ci

# Layered CI:
#   - build/vet/test + structure gates on every push and PR (fast, ~1.5 min)
#   - race matrix is opt-in on PRs (add the `run-race` label), runs nightly,
#     and on manual dispatch; it does not repeat on main pushes already
#     covered by the PR run.
#
# Release artifacts stay tag-only in release.yml; this workflow never
# publishes anything.
#
# Like release.yml, we use the runner-preinstalled Go instead of
# actions/setup-go: its codeload tarball download was persistently
# 429-rate-limited in this repo (release.yml §"Go toolchain"). `go version`
# keeps the toolchain actually used visible in the log.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly full race run (18:17 UTC).
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      run_race:
        description: "Run the race matrix"
        type: boolean
        default: true

permissions:
  contents: read

# A new push supersedes the in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + vet + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Go build and module caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Go toolchain (runner-preinstalled)
        run: go version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Frontend structure gates
        run: |
          bash scripts/audit_frontend_imports.sh
          python3 scripts/audit_free_identifiers.py

      - name: Backend structure gate
        run: go run ./cmd/audit-structure

      - name: Verify race shards cover every server test
        run: bash scripts/ci_race_shard.sh check

  race:
    name: race (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Opt-in on PRs via the `run-race` label; always on nightly/dispatch.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_race) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-race'))
    # Split by feature (scripts/ci_race_shard.sh); the slowest shard is the
    # critical path. ~2.5 min after the board-quota test fix.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [store, auth, mail, org, ops]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Go build and module caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Go toolchain (runner-preinstalled)
        run: go version

      - name: Race detector
        run: |
          if [ "${{ matrix.shard }}" = "store" ]; then
            go test -race -count=1 -timeout=15m ./internal/store
          else
            pattern=$(bash scripts/ci_race_shard.sh "${{ matrix.shard }}")
            go test -race -count=1 -timeout=15m ./internal/server -run "$pattern"
          fi
