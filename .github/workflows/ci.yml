name: ci

# CI:
#   - build/vet/test + structure gates on every push and PR (~16s warm)
#   - full race matrix on every push and PR too (~40s after the test-cost
#     fixes), plus a nightly run to catch flakiness on a clean schedule
#
# Release artifacts stay tag-only in release.yml; this workflow never
# publishes anything.
#
# Like release.yml, we use the runner-preinstalled Go instead of
# actions/setup-go: its codeload tarball download was persistently
# 429-rate-limited in this repo (release.yml §"Go toolchain"). `go version`
# keeps the toolchain actually used visible in the log.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full race run (18:17 UTC).
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + vet + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Go build and module caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Go toolchain (runner-preinstalled)
        run: go version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Frontend structure gates
        run: |
          bash scripts/audit_frontend_imports.sh
          python3 scripts/audit_free_identifiers.py

      - name: Backend structure gate
        run: go run ./cmd/audit-structure

      - name: Verify generated docs are current
        run: go run ./cmd/docs-stats -check

      - name: Verify race shards cover every server test
        run: bash scripts/ci_race_shard.sh check

  race:
    name: race (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Split by feature (scripts/ci_race_shard.sh); the slowest shard is the
    # critical path. ~40s after the board-quota and bcrypt test fixes, so it
    # runs on every push/PR rather than behind an opt-in gate.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [store, auth, mail, org, ops]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Go build and module caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Go toolchain (runner-preinstalled)
        run: go version

      - name: Race detector
        run: |
          if [ "${{ matrix.shard }}" = "store" ]; then
            go test -race -count=1 -timeout=15m ./internal/store
          else
            pattern=$(bash scripts/ci_race_shard.sh "${{ matrix.shard }}")
            go test -race -count=1 -timeout=15m ./internal/server -run "$pattern"
          fi
